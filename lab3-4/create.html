<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додати тварину</title>
    <link rel="stylesheet" href="create.css">
    <link rel="stylesheet" href="header.css">
</head>
<body>
    <header>
            <div class="left">
                <div class="logo">
                    <p>My Zoo</p>
                </div>
                <div class="nav">
                    <ul>
                        <li><a href="index.html">My Animals</a></li>
                        <li><a href="create.html" class="active">Create Animal</a></li>
                    </ul>
                </div>
            </div>

            <div class="right">
                <input
                    type="text"
                    class="smth-input"
                    placeholder="Type something..."
                />
                <a href="#" class="Search-link">Search</a>
                <button>Clear</button>
            </div>
        </header>
    <div class="container">
        <h1>Create animal</h1>
        
        <form id="animalForm">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Text...">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Опис тварини..."></textarea>
            </div>

            <div class="form-group">
                <label for="dailyExpense">Daily expense ($)</label>
                <div class="currency-input">
                    <input type="number" id="dailyExpense" value="5" min="0" step="0.01">
                </div>
            </div>

            <div class="form-group">
                <label for="animalType">Animal Type</label>
                <select id="animalType">
                    <option value="">Select Type</option>
                    <option value="mammal">Mammal</option>
                    <option value="bird">Bird</option>
                    <option value="reptile">Reptile</option>
                    <option value="fish">Fish</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>

        <div class="alert" id="alertMessage" style="display: none;">
            Oh snap! Change a few things up and try submitting again.
        </div>
    </div>

    <script>
    
    
    document.getElementById('animalForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;
    const dailyExpense = document.getElementById('dailyExpense').value;
    const animalType = document.getElementById('animalType').value;
    const alertMessage = document.getElementById('alertMessage');
    
    if (!title || !animalType) {
        alertMessage.style.display = 'block';
    } else {
        alertMessage.style.display = 'none';
        
        const animal = {
            id: Date.now(),
            title: title,
            description: description,
            dailyExpense: parseFloat(dailyExpense),
            animalType: animalType,
            createdAt: new Date().toISOString()
        };
        
        saveAnimalToStorage(animal);
        
        alert('Тварину успішно створено!');
        this.reset(); 
    }
});

function saveAnimalToStorage(animal) {
    let animals = JSON.parse(localStorage.getItem('animals')) || [];
    
    animals.push(animal);
    
    localStorage.setItem('animals', JSON.stringify(animals));
}
    </script>
</body>
</html>
