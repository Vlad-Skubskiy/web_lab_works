<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/style.css" />
        <title>Lab-Work-3</title>
    </head>
    <body>
        <header>
            <div class="left">
                <div class="logo">
                    <p>My Zoo</p>
                </div>
                <div class="nav">
                    <ul>
                        <li><a href="index.html" class="active">My Animals</a></li>
                        <li><a href="create.html">Create Animal</a></li>
                    </ul>
                </div>
            </div>

            <div class="right">
                <input
                    type="text"
                    class="smth-input"
                    placeholder="Type something..."
                />
                <a href="#" class="Search-link">Search</a>
                <button>Clear</button>
            </div>
        </header>

<main class="main-container">
    <aside class="sidebar">
        <h2>Manage animals</h2>
        <div class="sortbyExpense">
            <p>Sort by the most expensive animals</p>
            <label class="switch">
                <input type="checkbox" id="sortToggle" />
                <span class="slider"></span>
            </label>
        </div>
        <div class="count-section">
            <p>Count total daily expenses:</p>
            <button id="countBtn">Count</button>
            <p>Total expenses: <span id="total">$0</span></p>
        </div>
    </aside>

    <section class="content">
        <div id="animals-list" class="cards">
        </div>
    </section>
</main>
<script src="script.js"></script>
    </body>
</html>
